<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberEye Brain</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <style>
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #stream { width: 100%; flex: 1; object-fit: contain; transform: scaleX(-1); background: #050505; }
        .panel { height: 80px; background: #111; border-top: 1px solid #00ffcc; padding: 10px; font-size: 12px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: red; margin-right: 5px; }
    </style>
</head>
<body>
    <img id="stream" src="about:blank" />
    <div class="panel">
        <div><span id="dot" class="status-dot"></span> <span id="status">正在加载 AI 引擎...</span></div>
        <div id="debug" style="margin-top:5px; color: #888;">坐标: X:0, Y:0 | 眨眼: 0</div>
    </div>

    <script>
        const MASK_IP = "192.168.4.1";
        const img = document.getElementById('stream');
        const dot = document.getElementById('dot');
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');
        let ws;
        let smoothX = 0, smoothY = 0;

        // 注册离线 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // WebSocket 自动重连逻辑
        function connect() {
            ws = new WebSocket(`ws://${MASK_IP}:81`);
            ws.onopen = () => {
                dot.style.background = "#00ffcc";
                status.innerText = "神经链接已建立 (WebSocket OK)";
                img.src = `http://${MASK_IP}/stream`;
            };
            ws.onclose = () => {
                dot.style.background = "red";
                status.innerText = "链接断开，重连中...";
                setTimeout(connect, 2000);
            };
        }

        // MediaPipe FaceMesh 配置
        const faceMesh = new FaceMesh.FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        faceMesh.onResults(results => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const p = results.multiFaceLandmarks[0][468]; 
                const upper = results.multiFaceLandmarks[0][159];
                const lower = results.multiFaceLandmarks[0][145];
                
                // 手机端防抖平滑处理 (EMA)
                const rawX = (p.x - 0.5) * -150;
                const rawY = (p.y - 0.5) * -150;
                smoothX = smoothX * 0.6 + rawX * 0.4;
                smoothY = smoothY * 0.6 + rawY * 0.4;
                
                const blink = (Math.abs(upper.y - lower.y) < 0.018) ? 1 : 0;
                debug.innerText = `坐标: X:${Math.round(smoothX)}, Y:${Math.round(smoothY)} | 眨眼: ${blink}`;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(`${Math.round(smoothX)},${Math.round(smoothY)},${blink}`);
                }
            }
        });

        async function detect() {
            if (img.complete && img.naturalWidth > 0) {
                await faceMesh.send({image: img});
            }
            requestAnimationFrame(detect);
        }

        connect();
        detect();
    </script>
</body>
</html>
